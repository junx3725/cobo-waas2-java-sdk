name: OSV-Scanner
on:
  pull_request:
    branches: [ "master" ]
  merge_group:
    branches: [ "master" ]
  schedule:
    - cron: '43 1 * * 3'
  push:
    branches: [ "master" ]

permissions:
  security-events: write
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '11'  # 或你项目使用的 Java 版本
          distribution: 'temurin'
          
      - name: Build with Maven
        run: mvn clean package -DskipTests
        
      - name: Run OSV Scanner
        uses: google/osv-scanner/actions/maven@main
        with:
          # 指定 Maven 项目相关配置
          maven-args: '-f pom.xml'
          scan-args: |-
            -r
            --skip-git
            --lockfile=pom.xml
            ./
            
      # 可选：生成 SARIF 报告
      - name: Generate SARIF file
        run: |
          osv-scanner -r --format sarif ./pom.xml > osv-results.sarif
          
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: osv-results.sarif
